packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - '@parcel/watcher'
# Nuxt DevTools' older dependency ranges retain known command-execution flaws.
# Keep the patched Git guard/parser and shell argument quoting across consumers.
overrides:
  # One Vue runtime for workspace peers, SSR and shared interaction state.
  vue: 3.5.44
  shell-quote: 1.11.0
  simple-git: 4.0.2
# Compatible fixes for shared build/development tools. Keep major-version
# application API upgrades separate from these transitive selections.
  vite: 8.3.5
  launch-editor: 2.14.2
  source-map-js: 1.2.2
  serialize-javascript: 7.1.3
  '@modelcontextprotocol/client': 2.3.0
  '@modelcontextprotocol/server': 2.3.0
  'zod@>=4 <4.6.6': 4.6.7
  # Keep the shared translation runtime on the patched 11.x escaping contracts.
  'vue-i18n@>=11 <11.4.14': 11.4.14
  '@intlify/core@>=11 <11.4.14': 11.4.14
  '@intlify/core-base@>=11 <11.4.14': 11.4.14
  '@intlify/shared@>=11 <11.4.14': 11.4.14
# The Supabase module imports h3 without declaring it. Keep its server helpers
# on the same request API as the pinned Nuxt/Nitro runtime.
packageExtensions:
  '@nuxtjs/supabase@1.6.2':
    dependencies:
      h3: 1.15.11
