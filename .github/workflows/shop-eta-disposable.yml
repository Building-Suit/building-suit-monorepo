name: Disposable Shop ETA
on:
  pull_request:
    paths:
      - '.github/workflows/shop-eta-disposable.yml'
      - 'apps/shop-suit/supabase/**'
      - 'tooling/database/test-shop-eta*.mjs'
permissions:
  contents: read
concurrency:
  group: shop-eta-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  eta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable Shop backend
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export SUPABASE_HOME="$RUNNER_TEMP/shop-eta-supabase"
          if ! pnpm exec supabase --workdir apps/shop-suit start --exclude studio,realtime,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/shop-eta-start.log" 2>&1; then
            python - <<'PY'
          import os,re
          from pathlib import Path
          for line in Path(os.environ['RUNNER_TEMP']+'/shop-eta-start.log').read_text().splitlines():
              if re.search(r'^(ERROR:|error:|Error:|Applying migration|At statement|failed to|unexpected)',line):
                  line=re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+','[redacted]',line)
                  line=re.sub(r'(postgres(?:ql)?://)\S+',r'\1[redacted]',line)
                  print(line[:1000])
          PY
            exit 1
          fi
      - run: node tooling/database/test-shop-eta-local.mjs
      - run: node tooling/database/test-shop-tax-local.mjs
      - run: node tooling/database/test-shop-eta-concurrency.mjs

      - name: Generate verified public database contract
        run: pnpm exec supabase --workdir apps/shop-suit gen types typescript --local --schema public > "$RUNNER_TEMP/shop-eta-database.types.ts"
      - uses: actions/upload-artifact@v4
        with:
          name: shop-eta-database-types
          path: ${{ runner.temp }}/shop-eta-database.types.ts
      # Public schema declarations contain no credentials or customer data. Keep a
      # log recovery path for environments unable to download Azure-hosted artifacts.
      - name: Public database contract recovery
        run: |
          python - <<'PYTYPES'
          import base64,gzip,os
          from pathlib import Path
          data=Path(os.environ['RUNNER_TEMP']+'/shop-eta-database.types.ts').read_bytes()
          encoded=base64.b64encode(gzip.compress(data,mtime=0)).decode()
          for start in range(0,len(encoded),2000):
              print('SHOP_ETA_PUBLIC_TYPES='+encoded[start:start+2000])
          PYTYPES
