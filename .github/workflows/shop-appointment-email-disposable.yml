name: Disposable Shop appointment email reminders
on:
  pull_request:
    paths:
      - '.github/workflows/shop-appointment-email-disposable.yml'
      - 'apps/shop-suit/**'
      - 'packages/ui/**'
      - 'packages/ux/**'
      - 'tooling/database/test-shop-appointment-email-local.mjs'
      - 'tooling/database/configure-shop-reminder-schedule.mjs'
      - 'tooling/ui/build-appointment-reminder-email.mjs'
permissions:
  contents: read
concurrency:
  group: shop-appointment-email-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  appointment-email-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: node tooling/ui/build-appointment-reminder-email.mjs --check
      - name: Check deployable function graph without monorepo parent paths
        run: |
          mkdir -p "$RUNNER_TEMP/reminder-edge/shop-appointment-reminder-sender" "$RUNNER_TEMP/reminder-edge/_shared/generated"
          cp apps/shop-suit/supabase/functions/shop-appointment-reminder-sender/index.ts "$RUNNER_TEMP/reminder-edge/shop-appointment-reminder-sender/"
          cp apps/shop-suit/supabase/functions/_shared/appointment-reminders.mjs "$RUNNER_TEMP/reminder-edge/_shared/"
          cp apps/shop-suit/supabase/functions/_shared/generated/appointmentReminderEmail.ts "$RUNNER_TEMP/reminder-edge/_shared/generated/"
          deno check --no-config "$RUNNER_TEMP/reminder-edge/shop-appointment-reminder-sender/index.ts"
      - name: Start disposable Shop backend
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export SUPABASE_HOME="$RUNNER_TEMP/shop-appointment-email-supabase"
          if ! pnpm exec supabase --workdir apps/shop-suit start --exclude studio,realtime,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/shop-appointment-email-start.log" 2>&1; then
            python - <<'PY'
          import os,re
          from pathlib import Path
          for line in Path(os.environ['RUNNER_TEMP']+'/shop-appointment-email-start.log').read_text().splitlines():
              if re.search(r'^(ERROR:|error:|Error:|Applying migration|At statement|failed to|unexpected)',line):
                  line=re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+','[redacted]',line)
                  line=re.sub(r'(postgres(?:ql)?://)\S+',r'\1[redacted]',line)
                  print(line[:1000])
          PY
            exit 1
          fi
      - run: node --test apps/shop-suit/tests/unit/appointment-email-reminders.test.mjs apps/shop-suit/tests/unit/appointment-email-schedule.test.mjs
      - run: node tooling/database/test-shop-appointment-email-local.mjs
      - run: pnpm --filter @building-suit/shop-suit build
      - run: node --test apps/shop-suit/tests/integration/public-booking-built.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c apps/shop-suit/tests/e2e/ss-appt-002.config.ts
      - run: pnpm exec playwright test -c apps/shop-suit/tests/e2e/ss-appt-002-settings.config.ts
