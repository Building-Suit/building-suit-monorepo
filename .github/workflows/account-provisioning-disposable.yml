name: Disposable account provisioning validation
on:
  pull_request:
    paths:
      - '.github/workflows/account-provisioning-disposable.yml'
      - 'tooling/database/account-provisioning-disposable.mjs'
      - 'tooling/database/tests/account-provisioning-disposable.test.mjs'
      - 'apps/super-admin-suit/**'
      - 'apps/shop-suit/supabase/**'
      - 'tooling/database/test-shop-settings-local.mjs'
      - 'tooling/database/test-shop-currency-concurrency.mjs'
      - 'tooling/database/schema-contract-evidence.mjs'
      - 'apps/shop-suit/app/utils/owner-invitation.ts'
      - 'apps/shop-suit/app/pages/auth/owner-invitation.vue'
permissions:
  contents: read
concurrency:
  group: account-provisioning-disposable-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACCOUNT_PROVISION_DISPOSABLE: '1'
    steps:
      - name: Require GitHub-hosted disposable runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo "SUPABASE_HOME=$RUNNER_TEMP/account-provisioning-supabase" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare disposable legacy catalog upgrade fixture
        run: node tooling/database/account-provisioning-disposable.mjs --prepare-baseline
      - name: Start disposable Shop and SAS backends
        run: |
          if ! pnpm exec supabase --workdir apps/shop-suit start --exclude studio,realtime,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/accounts-shop-start.log" 2>&1; then
            node tooling/database/account-provisioning-disposable.mjs --startup-errors "$RUNNER_TEMP/accounts-shop-start.log"
            exit 1
          fi
          if ! pnpm exec supabase --workdir apps/super-admin-suit start --exclude studio,realtime,storage-api,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/accounts-sas-start.log" 2>&1; then
            node tooling/database/account-provisioning-disposable.mjs --startup-errors "$RUNNER_TEMP/accounts-sas-start.log"
            exit 1
          fi
      - name: Verify Shop settings and issued snapshots in the disposable database
        run: node tooling/database/test-shop-settings-local.mjs
      - name: Generate schema contracts from disposable databases
        run: |
          # Reuse the official metadata image, or its official publisher mirror.
          if ! docker image inspect public.ecr.aws/supabase/postgres-meta:v0.98.0 > /dev/null 2>&1; then
            docker pull docker.io/supabase/postgres-meta:v0.98.0
            docker tag docker.io/supabase/postgres-meta:v0.98.0 public.ecr.aws/supabase/postgres-meta:v0.98.0
          fi
          mkdir -p "$RUNNER_TEMP/account-schema-contracts/shop" "$RUNNER_TEMP/account-schema-contracts/sas"
          pnpm exec supabase --workdir apps/shop-suit gen types typescript --local > "$RUNNER_TEMP/account-schema-contracts/shop/database.types.ts"
          pnpm exec supabase --workdir apps/super-admin-suit gen types typescript --local > "$RUNNER_TEMP/account-schema-contracts/sas/database.types.ts"
      - name: Record generated Shop schema delta and digests
        run: node tooling/database/schema-contract-evidence.mjs apps/shop-suit/app/types/database.types.ts "$RUNNER_TEMP/account-schema-contracts/shop/database.types.ts"
      - uses: actions/upload-artifact@v4
        with:
          name: account-schema-contracts
          path: ${{ runner.temp }}/account-schema-contracts
          retention-days: 7
      - name: Validate SQL, signed dispatch, real Auth and local invitation claim
        run: node tooling/database/account-provisioning-disposable.mjs
      - name: Stop only this job's disposable stacks
        if: always() && runner.environment == 'github-hosted'
        run: |
          pnpm exec supabase --workdir apps/shop-suit stop --project-id building-suit-shop --no-backup
          pnpm exec supabase --workdir apps/super-admin-suit stop --project-id building-suit-super-admin --no-backup
          rm -f "$RUNNER_TEMP/accounts-shop-start.log" "$RUNNER_TEMP/accounts-sas-start.log"
