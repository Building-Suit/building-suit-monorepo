name: Doctor synthetic data authorization
on:
  pull_request:
    paths:
      - 'apps/doctor-suit/**'
      - 'docs/architecture/environments.json'
      - 'packages/ui/**'
      - 'packages/contracts/**'
      - 'packages/nuxt-layer/**'
      - 'packages/brand/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'packages/ux/**'
      - 'packages/testing/playwright.auth-parity.config.ts'
      - '.github/workflows/doctor-disposable.yml'
  push:
    branches: [stg]
    paths:
      - 'apps/doctor-suit/**'
      - 'docs/architecture/environments.json'
      - 'packages/ui/**'
      - 'packages/contracts/**'
      - 'packages/nuxt-layer/**'
      - 'packages/brand/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'packages/ux/**'
      - 'packages/testing/playwright.auth-parity.config.ts'
      - '.github/workflows/doctor-disposable.yml'
permissions:
  contents: read
concurrency:
  group: doctor-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doctor-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify isolated local target and lifecycle guards
        run: node --test apps/doctor-suit/tests/unit/dos-m1-003.test.mjs
      - name: Apply actual migrations and assert SQL/RLS authorization with synthetic fixtures
        # A minimal provider Auth contract is scaffolding, not full Supabase service acceptance.
        run: node apps/doctor-suit/tests/disposable-postgres.mjs --types
      - name: Retain generated public schema types (no credentials or runtime data)
        uses: actions/upload-artifact@v4
        with:
          name: doctor-public-schema-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/doctor-suit/app/types/database.types.ts
            apps/doctor-suit/supabase/functions/_shared/database.types.ts
          if-no-files-found: error
          retention-days: 7
  doctor-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @building-suit/doctor-suit build
        id: production-build
      - run: pnpm exec playwright install --with-deps chromium
        id: browser-runtime
      - name: Verify synthetic Doctor preview in both locales, themes and viewport sizes
        run: pnpm exec playwright test -c apps/doctor-suit/tests/e2e/playwright.config.ts
      - name: Verify account protocol journeys without external mail or credential artifacts
        # The HTTP fixture does not prove actual Supabase Auth service acceptance.
        run: pnpm exec playwright test -c apps/doctor-suit/tests/e2e/playwright.auth.config.ts
      - name: Verify delegation under slower CPU and RPC timing
        env:
          DOCTOR_PROTOCOL_STRESS: 'true'
        run: pnpm exec playwright test -c apps/doctor-suit/tests/e2e/playwright.auth.config.ts --grep 'two doctors' --repeat-each=2

      - name: Check portable private document function
        run: pnpm exec tsc -p apps/doctor-suit/tests/tsconfig.edge.json
      - name: Verify all ten M3 tasks against owned disposable Auth and PostgREST
        # Independent of protocol and inherited Realtime failures. Each runner
        # must clean up its own project; existing resources are never reused.
        # No provider delivery or clinical/legal approval is inferred.
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' && steps.browser-runtime.outcome == 'success' }}
        env:
          DOCTOR_OPERATIONS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node apps/doctor-suit/tests/operations-actual-provider.mjs
      - name: Verify actual disposable Doctor Auth, Storage and Functions
        # Synthetic local users/files only. Runner owns its project lifecycle.
        # Captured service keys, emails and byte bodies are never published.
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' && steps.browser-runtime.outcome == 'success' }}
        run: node apps/doctor-suit/tests/disposable-provider.mjs
      - name: Verify canonical Doctor asset drop-in with a fresh production build
        run: node apps/doctor-suit/tests/brand-build-fixture.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: doctor-synthetic-browser-results
          path: |
            test-results/doctor
            test-results/doctor-m2-actual
          if-no-files-found: ignore
      - name: Retain redacted M3 execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-m3-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/doctor-m3-actual/provider-receipt.json
          if-no-files-found: error
          retention-days: 7
  shared-settings-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm build --concurrency=2
        env:
          SUPABASE_URL: http://127.0.0.1:60321
          SUPABASE_KEY: local-development-publishable-key
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify existing shared auth and access presentation retains default behavior
        run: pnpm exec playwright test -c packages/testing/playwright.auth-parity.config.ts
      - name: Verify settings in existing consumers with local-only targets and no n8n access
        run: pnpm exec playwright test -c packages/testing/playwright.settings-focus.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-settings-focus-results
          path: test-results/settings-focus
          if-no-files-found: ignore

  doctor-android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - name: Build the separate bundled synthetic Android client
        run: |
          pnpm --filter @building-suit/doctor-mobile typecheck
          pnpm --filter @building-suit/doctor-mobile build
          python3 apps/doctor-suit/mobile/doctor/scripts/android-brand.py
          pnpm --filter @building-suit/doctor-mobile sync
          pnpm --filter @building-suit/doctor-mobile android:build
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: .local/doctor-android/
          if-no-files-found: error
          retention-days: 7
  doctor-android-device:
    needs: doctor-android-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: doctor-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: .local/doctor-android/
      - name: Allow the owned runner to accelerate its disposable emulator
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          DOCTOR_ANDROID_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: node apps/doctor-suit/mobile/doctor/scripts/verify-android.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-android-device-${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/doctor-mobile/
          if-no-files-found: error
          retention-days: 7
