name: Disposable Shop public profile
on:
  pull_request:
    paths:
      - '.github/workflows/shop-website-profile-disposable.yml'
      - 'apps/shop-suit/supabase/**'
      - 'apps/shop-suit/server/plugins/website-host.ts'
      - 'apps/shop-suit/server/utils/websiteHost.ts'
      - 'apps/shop-suit/shared/websiteProfile.ts'
      - 'apps/shop-suit/app/composables/useWebsiteProfile.ts'
      - 'apps/shop-suit/app/pages/settings.vue'
      - 'apps/shop-suit/tests/**/website-*'
      - 'packages/ui/src/organisms/BsWebsiteProfileSettings.vue'
      - 'packages/ui/src/types/websiteProfilePresentation.ts'
      - 'packages/ux/src/utils/readPublicLogo.ts'
      - 'packages/ui/src/templates/BsBusinessSettingsPage.vue'
      - 'tooling/database/test-shop-website-profile*.mjs'
permissions:
  contents: read
concurrency:
  group: shop-website-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  website-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable Shop backend
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export SUPABASE_HOME="$RUNNER_TEMP/shop-website-profile-supabase"
          if ! pnpm exec supabase --workdir apps/shop-suit start --exclude studio,realtime,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/shop-website-profile-start.log" 2>&1; then
            python - <<'PY'
          import os,re
          from pathlib import Path
          for line in Path(os.environ['RUNNER_TEMP']+'/shop-website-profile-start.log').read_text().splitlines():
              if re.search(r'^(ERROR:|error:|Error:|Applying migration|At statement|failed to|unexpected)',line):
                  line=re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+','[redacted]',line)
                  line=re.sub(r'(postgres(?:ql)?://)\S+',r'\1[redacted]',line)
                  print(line[:1000])
          PY
            exit 1
          fi
      - run: node tooling/database/test-shop-website-profile-local.mjs
      - run: pnpm --filter @building-suit/shop-suit build
      - run: node --test apps/shop-suit/tests/integration/website-host-built.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c apps/shop-suit/tests/e2e/website-profile.config.ts
