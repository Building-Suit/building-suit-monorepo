name: Disposable Shop appointment access
on:
  pull_request:
    paths:
      - '.github/workflows/shop-appointment-access-disposable.yml'
      - 'apps/shop-suit/**'
      - 'packages/ui/**'
      - 'packages/ux/**'
      - 'tooling/database/test-shop-appointment-access-local.mjs'
permissions:
  contents: read
concurrency:
  group: shop-appointment-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  appointment-access:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable Shop backend
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export SUPABASE_HOME="$RUNNER_TEMP/shop-appointment-access-supabase"
          if ! pnpm exec supabase --workdir apps/shop-suit start --exclude studio,realtime,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/shop-appointment-access-start.log" 2>&1; then
            python - <<'PY'
          import os,re
          from pathlib import Path
          for line in Path(os.environ['RUNNER_TEMP']+'/shop-appointment-access-start.log').read_text().splitlines():
              if re.search(r'^(ERROR:|error:|Error:|Applying migration|At statement|failed to|unexpected)',line):
                  line=re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+','[redacted]',line)
                  line=re.sub(r'(postgres(?:ql)?://)\S+',r'\1[redacted]',line)
                  print(line[:1000])
          PY
            exit 1
          fi
      - run: node tooling/database/test-shop-appointment-access-local.mjs
      - run: pnpm --filter @building-suit/shop-suit build
      - run: node --test apps/shop-suit/tests/integration/website-host-built.test.mjs apps/shop-suit/tests/integration/website-public-built.test.mjs apps/shop-suit/tests/integration/appointment-access-built.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c apps/shop-suit/tests/e2e/appointment-access.config.ts
      - run: pnpm exec playwright test -c apps/shop-suit/tests/e2e/appointment-actions.config.ts
      - run: pnpm exec playwright test -c apps/shop-suit/tests/e2e/ss-web-public-001-obligation-2.config.ts
