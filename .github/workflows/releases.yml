name: Reconcile upcoming releases and freeze production
on:
  push:
    branches: [stg, main]
  workflow_run:
    workflows: [Verify workspace]
    types: [completed]
    branches: [stg, main]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
  actions: read
  checks: read
  statuses: read
jobs:
  plan:
    # No environment or catalog credentials are requested while selecting targets.
    if: github.repository == 'Building-Suit/building-suit-monorepo'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.targets.outputs.enabled }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Select authoritative targets admitted by the workflow ref
        id: targets
        run: node tooling/releases/reconcile-targets.mjs
  reconcile:
    needs: plan
    # Never subscribe to deployment_status: these jobs emit it themselves.
    # Publisher readiness still re-reads protected refs and remains authoritative.
    if: needs.plan.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    concurrency:
      group: release-catalog-${{ matrix.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - name: Check publisher adoption on the checked-out protected branch
        id: publisher
        shell: bash
        run: |
          if git cat-file -e HEAD:tooling/releases/publisher.mjs 2>/dev/null; then
            echo 'adopted=true' >> "$GITHUB_OUTPUT"
          elif test -n "$(git log -1 --format=%H -- tooling/releases/publisher.mjs)"; then
            echo '::error::This branch previously adopted the release publisher, but its entrypoint is missing.'
            exit 1
          else
            echo 'adopted=false' >> "$GITHUB_OUTPUT"
            echo '::notice::This protected branch has not adopted the release publisher; no publication was attempted.'
          fi
      - uses: actions/setup-node@v4
        if: steps.publisher.outputs.adopted == 'true'
        with:
          node-version-file: .node-version
      - name: Refresh net candidate or freeze exact production release after deployment readiness
        if: steps.publisher.outputs.adopted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: ${{ matrix.environment }}
          RELEASE_CATALOG_URL: ${{ vars.RELEASE_CATALOG_URL }}
          RELEASE_CATALOG_TOKEN: ${{ secrets.RELEASE_CATALOG_TOKEN }}
          RELEASE_STAGING_URL: ${{ vars.RELEASE_STAGING_URL }}
          RELEASE_STAGING_TOKEN: ${{ secrets.RELEASE_STAGING_TOKEN }}
          RELEASE_REQUIRED_CONTEXTS: ${{ vars.RELEASE_REQUIRED_CONTEXTS }}
        run: node tooling/releases/publisher.mjs
