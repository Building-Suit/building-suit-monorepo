name: Disposable Shop taxes
on:
  pull_request:
    paths:
      - '.github/workflows/shop-taxes-disposable.yml'
      - 'apps/shop-suit/supabase/**'
      - 'tooling/database/test-shop-tax*.mjs'
permissions:
  contents: read
concurrency:
  group: shop-taxes-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  taxes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable Shop backend
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export SUPABASE_HOME="$RUNNER_TEMP/shop-tax-supabase"
          if ! pnpm exec supabase --workdir apps/shop-suit start --exclude studio,realtime,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/shop-tax-start.log" 2>&1; then
            python - <<'PY'
          import os,re
          from pathlib import Path
          for line in Path(os.environ['RUNNER_TEMP']+'/shop-tax-start.log').read_text().splitlines():
              if re.search(r'^(ERROR:|error:|Error:|Applying migration|At statement|failed to|unexpected)',line):
                  line=re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+','[redacted]',line)
                  line=re.sub(r'(postgres(?:ql)?://)\S+',r'\1[redacted]',line)
                  print(line[:1000])
          PY
            exit 1
          fi
      - run: node tooling/database/test-shop-tax-local.mjs

      - name: Generate verified public database contract
        run: |
          # CLI 2.116.0 pins metadata v0.98.0. Reuse its local image when present;
          # otherwise use the same official publisher mirror as the SAS workflow.
          # This avoids the exhausted shared ECR quota without skipping generation.
          if ! docker image inspect public.ecr.aws/supabase/postgres-meta:v0.98.0 > /dev/null 2>&1; then
            docker pull docker.io/supabase/postgres-meta:v0.98.0
            docker tag docker.io/supabase/postgres-meta:v0.98.0 public.ecr.aws/supabase/postgres-meta:v0.98.0
          fi
          pnpm exec supabase --workdir apps/shop-suit gen types typescript --local --schema public > "$RUNNER_TEMP/shop-tax-database.types.ts"
      - uses: actions/upload-artifact@v4
        with:
          name: shop-tax-database-types
          path: ${{ runner.temp }}/shop-tax-database.types.ts
