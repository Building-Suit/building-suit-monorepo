# Automation Suit control-plane Supabase scaffold.
# The Nuxt dashboard does NOT expose the control schema through the Data API.
# It connects server-side through a dedicated read-only PostgreSQL role.

project_id = "building-suit-automation"

[api]
enabled = false
port = 63321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 63322
shadow_port = 63320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 63329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = false

[studio]
enabled = false
port = 63323
api_url = "http://127.0.0.1"

[inbucket]
enabled = false
port = 63324

[storage]
enabled = false
file_size_limit = "50MiB"

[auth]
enabled = false
site_url = "http://127.0.0.1:3015"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[edge_runtime]
enabled = false
policy = "per_worker"
inspector_port = 63328

[analytics]
enabled = false
port = 63327
backend = "postgres"
