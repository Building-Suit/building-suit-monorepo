# Local-only Super Admin Supabase scaffold. Hosted identifiers and secrets do not belong here.
project_id = "building-suit-super-admin"

[api]
enabled = true
port = 64321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 64322
shadow_port = 64320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 64329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
port = 64323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 64324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3004"
additional_redirect_urls = ["http://localhost:3004/confirm", "http://127.0.0.1:3004/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "{{ .Token }} is your Super Admin Suit verification code"
content_path = "./supabase/templates/confirmation.html"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 64328

[analytics]
enabled = false
port = 64327
backend = "postgres"
